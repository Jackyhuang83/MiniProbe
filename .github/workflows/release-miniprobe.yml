name: Release MiniProbe Current Version

on:
  # Publish automatically only when the version changes (Makefile) or when
  # this release workflow is updated. Unrelated commits do not publish.
  push:
    branches: [main]
    paths:
      - Makefile
      - .github/workflows/release-miniprobe.yml
  workflow_dispatch:

permissions:
  contents: write

# Two concurrent runs must not race to publish the same immutable tag.
concurrency:
  group: miniprobe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify patched Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.10"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(awk '/^VERSION \?=/{print $3}' Makefile)"

          if [ -z "$VERSION" ]; then
            echo "Unable to read VERSION from Makefile."
            exit 1
          fi

          TAG="v$VERSION"
          CHANGELOG="CHANGELOG-$TAG.md"

          if [ ! -f "$CHANGELOG" ]; then
            echo "Missing changelog: $CHANGELOG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Changelog: $CHANGELOG"

      - name: Check release has not been published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # An orphan/pre-existing tag is not ours to overwrite or repoint.
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists without a published Release. Manual review required."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.existing.outputs.publish == 'true'
        run: |
          go test ./...
          go vet ./...
          node --check cmd/miniprobe-server/web/app.js
          node --check cmd/miniprobe-server/web/network.js
          node --check cmd/miniprobe-server/web/traffic.js
          node --check cmd/miniprobe-server/web/subscriptions.js
          node scripts/test-release-version.cjs
          node scripts/test-subscription-cards.cjs
          node scripts/test-traffic-ranking.cjs
          node scripts/test-dashboard-header.cjs

      - name: Build release binaries
        if: steps.existing.outputs.publish == 'true'
        run: make release
      - name: Verify embedded Go build version
        if: steps.existing.outputs.publish == 'true'
        run: |
          for binary in dist/miniprobe-{server,agent}-linux-{amd64,arm64} dist/miniprobe-agent-linux-armv7; do
            go version -m "$binary" | grep -Fq 'go1.26.10'
          done


      - name: Create GitHub Release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()

          case "$VERSION" in
            *alpha*|*beta*|*rc*)
              EXTRA_ARGS+=(--prerelease)
              ;;
          esac

          gh release create "$TAG" \
            dist/miniprobe-server-linux-amd64 \
            dist/miniprobe-server-linux-arm64 \
            dist/miniprobe-agent-linux-amd64 \
            dist/miniprobe-agent-linux-arm64 \
            dist/miniprobe-agent-linux-armv7 \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "MiniProbe $TAG" \
            --notes-file "$CHANGELOG" \
            "${EXTRA_ARGS[@]}"
