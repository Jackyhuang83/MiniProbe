name: Validate MiniProbe

on:
  pull_request:
    branches: [main, feature/topology-dev1-20261022, feature/topology-dev2-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify patched Go toolchain
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.10"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Check Dashboard JavaScript syntax
        run: |
          node --check cmd/miniprobe-server/web/app.js
          node --check cmd/miniprobe-server/web/network.js
          node --check cmd/miniprobe-server/web/traffic.js
          node --check cmd/miniprobe-server/web/topology.js
      - name: Check ranking usage tiers and expiry dates
        run: node scripts/test-traffic-ranking.cjs
      - name: Cross-build release binaries (no publish)
        run: make release
      - name: Attach DEV3 test binaries (not a Release)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/topology-dev3-traffic-20261022'
        uses: actions/upload-artifact@v4
        with:
          name: miniprobe-dev3-test-binaries
          path: |
            dist/miniprobe-server-linux-amd64
            dist/miniprobe-server-linux-arm64
            dist/miniprobe-agent-linux-amd64
            dist/miniprobe-agent-linux-arm64
            dist/miniprobe-agent-linux-armv7
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
      - name: Verify embedded Go build version
        run: |
          for binary in dist/miniprobe-{server,agent}-linux-{amd64,arm64} dist/miniprobe-agent-linux-armv7; do
            go version -m "$binary" | grep -Fq 'go1.26.10'
          done

