name: Validate MiniProbe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Check Dashboard JavaScript syntax
        run: |
          node --check cmd/miniprobe-server/web/app.js
          node --check cmd/miniprobe-server/web/network.js
          node --check cmd/miniprobe-server/web/traffic.js
      - name: Check ranking usage tiers and expiry dates
        run: node scripts/test-traffic-ranking.cjs
      - name: Cross-build release binaries (no publish)
        run: make release
