name: Publish MiniProbe Docker Server

on:
  # Publish the Docker image when a Server release version changes (Makefile),
  # or when Docker deployment/publishing files change. Ordinary code commits do
  # not trigger an expensive multi-architecture build.
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - 'deploy/docker/**'
      - '.github/workflows/docker-miniprobe.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: miniprobe-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Prepare QEMU
        uses: docker/setup-qemu-action@v3
      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push pinned multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jackyhuang83/miniprobe-server:docker-dev1
            ghcr.io/jackyhuang83/miniprobe-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
