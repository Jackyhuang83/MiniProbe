# Optional connector. Activate after stopping the old MiniProbe Tunnel.
# Cloudflare remote-managed origin must be http://server:28888 (Docker DNS).
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      server:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/miniprobe_tunnel_token
    secrets:
      - miniprobe_tunnel_token
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  miniprobe_tunnel_token:
    file: ./secrets/cloudflared.token
