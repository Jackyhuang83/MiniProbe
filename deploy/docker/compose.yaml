# Separate Compose project; never mount HomeSphere data or the Docker socket.
name: miniprobe
services:
  server:
    image: ${MINIPROBE_IMAGE:-ghcr.io/jackyhuang83/miniprobe-server:docker-dev1}
    pull_policy: missing
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    ports:
      - "127.0.0.1:28888:28888"
    environment:
      MINIPROBE_DEPLOYMENT: docker
    volumes:
      - ./data:/var/lib/miniprobe:rw
    tmpfs:
      - /run/miniprobe:rw,nosuid,nodev,noexec,mode=0700,uid=10001,gid=10001,size=1m
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:28888/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
